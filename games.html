<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EcoBala - Games</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="topbar"><div class="container nav"><a class="brand" href="index.html"><img src="assets/ecobala-logo.svg" alt="logo"/><span>EcoBala</span></a><nav><a href="index.html" data-i18n="home">Главная</a><a href="tasks.html" data-i18n="tasks">Задачи</a><a href="director.html" data-i18n="director">Директор</a></nav><div class="lang-switch"><button class="lang-btn" data-lang="ru">RU</button><button class="lang-btn" data-lang="en">EN</button><button class="lang-btn" data-lang="kz">KZ</button></div></div></header>
<main class="container panel">
  <h1 data-i18n="gamesTitle">Игры и головоломки</h1>
  <div class="grid two">
    <section class="card">
      <h3>Recycling challenge</h3>
      <p>Choose the item that should go to recycling.</p>
      <div class="actions">
        <button class="btn btn-secondary guess" data-ok="1">Plastic bottle</button>
        <button class="btn btn-secondary guess" data-ok="0">Dirty napkin</button>
        <button class="btn btn-secondary guess" data-ok="0">Food waste</button>
      </div>
      <p id="guessResult" class="muted"></p>
    </section>

    <section class="card puzzle-card">
      <h3 data-i18n="puzzleTitle">Головоломка: собери путь к чистому будущему</h3>
      <p>Нажмите блоки в правильном порядке: Water → Trees → Clean City</p>
      <div class="puzzle-grid" id="puzzleGrid">
        <button class="puzzle-piece" data-step="2">🌳 Trees</button>
        <button class="puzzle-piece" data-step="1">💧 Water</button>
        <button class="puzzle-piece" data-step="3">🏙️ Clean City</button>
      </div>
      <p id="puzzleStatus" class="muted"></p>
    </section>
  </div>
</main>
<nav class="mobile-nav"><a href="index.html" data-i18n="home">Главная</a><a href="tasks.html" data-i18n="tasks">Задачи</a><a href="games.html" class="active" data-i18n="games">Игры</a><a href="director.html" data-i18n="director">Директор</a></nav>
<script src="database.js"></script>
<script src="i18n.js"></script>
<script src="games.js"></script>
<script>logActivity('Open games page');</script>
</body>
</html>

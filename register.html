<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EcoBala — Регистрация</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar"><div class="container nav"><div class="brand">🌿 <span>EcoBala</span></div><nav><a href="index.html">Главная</a><a href="tasks.html">Задачи</a><a href="games.html">Игры</a></nav></div></header>
  <main class="container panel">
    <h1>Регистрация</h1>
    <p class="muted">Данные сохраняются в локальной базе браузера (LocalStorage) для демо-режима.</p>
    <form id="registerForm" class="card form-grid">
      <label>Имя ученика<input required name="name" /></label>
      <label>Возраст<input required name="age" type="number" min="7" max="17" /></label>
      <label>Роль
        <select name="role"><option>Ребенок</option><option>Подросток</option></select>
      </label>
      <label>Школа<input required name="school" /></label>
      <label>Город<input required name="city" /></label>
      <button class="btn btn-primary" type="submit">Зарегистрироваться</button>
    </form>
    <section class="card" style="margin-top:1rem">
      <h3>Зарегистрированные участники</h3>
      <ul id="usersList" class="quests"></ul>
    </section>
  </main>
  <script src="database.js"></script>
  <script src="register.js"></script>
</body>
</html>

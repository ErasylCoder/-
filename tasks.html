<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EcoBala — Задачи</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="topbar"><div class="container nav"><div class="brand">🌿 <span>EcoBala</span></div><nav><a href="index.html">Главная</a><a href="register.html">Регистрация</a><a href="games.html">Игры</a></nav></div></header>
<main class="container panel">
  <h1>Страница задач</h1>
  <div id="tasksGrid" class="grid two"></div>

  <section class="card" style="margin-top:1rem">
    <h3>Загрузка фото-отчета</h3>
    <form id="reportForm" class="form-grid">
      <label>Выберите задачу
        <select name="taskId" id="taskSelect"></select>
      </label>
      <label>Комментарий
        <input name="comment" placeholder="Что вы сделали?" required />
      </label>
      <label>Фото результата
        <input type="file" name="photo" id="photoInput" accept="image/*" required />
      </label>
      <button class="btn btn-primary" type="submit">Сохранить отчет</button>
    </form>
    <div id="previewWrap" class="preview"></div>
  </section>
</main>
<script src="database.js"></script>
<script src="tasks.js"></script>
</body>
</html>

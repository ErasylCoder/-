<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EcoBala - Tasks</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="topbar"><div class="container nav"><a class="brand" href="index.html"><img src="assets/ecobala-logo.svg" alt="logo"/><span>EcoBala</span></a><nav><a href="index.html" data-i18n="home">Главная</a><a href="games.html" data-i18n="games">Игры</a><a href="director.html" data-i18n="director">Директор</a><a href="admin.html" data-i18n="admin">Админ</a></nav><div class="lang-switch"><button class="lang-btn" data-lang="ru">RU</button><button class="lang-btn" data-lang="en">EN</button><button class="lang-btn" data-lang="kz">KZ</button></div></div></header>
<main class="container panel">
  <h1 data-i18n="tasksTitle">Экологические задания</h1>
  <div id="tasksGrid" class="grid two"></div>

  <section class="card" style="margin-top:1rem">
    <h3 data-i18n="upload">Загрузка фото-отчета</h3>
    <form id="reportForm" class="form-grid">
      <label><span data-i18n="chooseTask">Выберите задачу</span><select name="taskId" id="taskSelect"></select></label>
      <label><span data-i18n="comment">Комментарий</span><input name="comment" data-i18n-placeholder="comment" required /></label>
      <label><span data-i18n="photo">Фото результата</span><input type="file" name="photo" id="photoInput" accept="image/*" required /></label>
      <button class="btn btn-primary" type="submit" data-i18n="save">Сохранить отчет</button>
    </form>
    <div id="previewWrap" class="preview"></div>
  </section>
</main>
<nav class="mobile-nav"><a href="index.html" data-i18n="home">Главная</a><a href="tasks.html" class="active" data-i18n="tasks">Задачи</a><a href="director.html" data-i18n="director">Директор</a><a href="admin.html" data-i18n="admin">Админ</a></nav>
<script src="database.js"></script>
<script src="i18n.js"></script>
<script src="tasks.js"></script>
<script>logActivity('Open tasks page');</script>
</body>
</html>

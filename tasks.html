<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EcoBala — Tasks</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="topbar"><div class="container nav"><a class="brand" href="index.html">🌿 <span>EcoBala</span></a><nav><a href="index.html" data-i18n="navHome">Главная</a><a href="register.html" data-i18n="navRegister">Регистрация</a><a href="games.html" data-i18n="navGames">Игры</a><a href="admin.html" data-i18n="navAdmin">Админ</a></nav><div class="lang-switch"><button class="lang-btn" data-lang="ru">RU</button><button class="lang-btn" data-lang="en">EN</button><button class="lang-btn" data-lang="kz">KZ</button></div></div></header>
<main class="container panel">
  <h1 data-i18n="tasksTitle">Страница задач</h1>
  <div id="tasksGrid" class="grid two"></div>

  <section class="card" style="margin-top:1rem">
    <h3 data-i18n="upload">Загрузка фото-отчета</h3>
    <form id="reportForm" class="form-grid">
      <label><span data-i18n="chooseTask">Выберите задачу</span>
        <select name="taskId" id="taskSelect"></select>
      </label>
      <label><span data-i18n="comment">Комментарий</span>
        <input name="comment" data-i18n-placeholder="comment" placeholder="Комментарий" required />
      </label>
      <label><span data-i18n="photo">Фото результата</span>
        <input type="file" name="photo" id="photoInput" accept="image/*" required />
      </label>
      <button class="btn btn-primary" type="submit" data-i18n="saveReport">Сохранить отчет</button>
    </form>
    <div id="previewWrap" class="preview"></div>
  </section>
</main>
<nav class="mobile-nav">
  <a href="index.html" data-i18n="mobileHome">Главная</a>
  <a href="tasks.html" class="active" data-i18n="navTasks">Задачи</a>
  <a href="games.html" data-i18n="navGames">Игры</a>
  <a href="register.html" data-i18n="navRegister">Регистрация</a>
</nav>
<script src="database.js"></script>
<script src="i18n.js"></script>
<script src="tasks.js"></script>
</body>
</html>
